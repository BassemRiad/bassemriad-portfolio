AWSTemplateFormatVersion: "2010-09-09"
Description: Bassem Riad's personal portfolio, in a private S3 bucket served globally over HTTPS by CloudFront.

Parameters:
  BucketName:
    Type: String
    Default: ""
    Description: >-
      Globally unique bucket name (lowercase letters, numbers, hyphens).
      Leave empty to let CloudFormation generate one.
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain (for example bassemriad.com).
  AlternateDomainName:
    Type: String
    Default: ""
    Description: >-
      Optional second alias, e.g. www.bassemriad.com for a root domain.
      Leave empty for a subdomain that doesn't need one.
  CertificateArn:
    Type: String
    Default: ""
    Description: ARN of an existing ACM certificate in us-east-1 that covers DomainName (and AlternateDomainName, if set).

Conditions:
  HasBucketName: !Not [!Equals [!Ref BucketName, ""]]
  HasCustomDomain: !Not [!Equals [!Ref CertificateArn, ""]]
  HasAlternateDomain: !Not [!Equals [!Ref AlternateDomainName, ""]]

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !If [HasBucketName, !Ref BucketName, !Ref "AWS::NoValue"]
      # The bucket stays private; only CloudFront can read from it.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      # Turns on S3 request metrics (AllRequests, GetRequests, ...) in CloudWatch.
      MetricsConfigurations:
        - Id: EntireBucket

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} website"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If
          - HasCustomDomain
          - !If [HasAlternateDomain, [!Ref DomainName, !Ref AlternateDomainName], [!Ref DomainName]]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.3_2025
          - !Ref "AWS::NoValue"
        Origins:
          - Id: s3-website-bucket
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-website-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed policy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # A private S3 origin returns 403 for missing files; each page is its
        # own file here (no client-side router), so unknown paths get a real 404.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,
             "properties":{"title":"CloudFront requests","region":"us-east-1","stat":"Sum","period":300,
               "metrics":[["AWS/CloudFront","Requests","DistributionId","${Distribution}","Region","Global"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,
             "properties":{"title":"S3 all requests","region":"${AWS::Region}","stat":"Sum","period":300,
               "metrics":[["AWS/S3","AllRequests","BucketName","${WebsiteBucket}","FilterId","EntireBucket"]]}}
          ]
        }

Outputs:
  BucketName:
    Description: Bucket to upload the website files to
    Value: !Ref WebsiteBucket
  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidations)
    Value: !Ref Distribution
  WebsiteURL:
    Description: CloudFront URL (HTTPS)
    Value: !Sub "https://${Distribution.DomainName}"
