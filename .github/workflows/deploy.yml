name: Deploy portfolio

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::743976413633:role/GitHubDeployRole-bassemriad-portfolio
          aws-region: us-east-1

      - name: Upload site to S3
        run: >
          aws s3 sync . s3://bassem-riad-portfolio-site
          --exclude ".git/*" --exclude ".github/*" --exclude ".claude/*"
          --exclude "template.yaml" --exclude "README.md" --delete

      - name: Clear CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id E334XWTQ2NTUOZ --paths "/*"
